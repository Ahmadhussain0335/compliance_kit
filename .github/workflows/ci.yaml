name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart run melos run analyze --no-select

      - name: Test pure Dart packages with coverage (90% minimum)
        run: dart run melos run coverage --no-select

      - name: Test Flutter packages with coverage
        run: dart run melos run coverage:flutter --no-select

      - name: Print coverage summary
        if: always()
        run: |
          for f in packages/*/coverage/lcov.info; do
            [ -f "$f" ] || continue
            echo "== $f"
            sh tool/coverage_summary.sh "$f" | tail -1
          done

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: packages/*/coverage/lcov.info
          if-no-files-found: ignore
