name: Feature request
description: Suggest an improvement or a new control.
labels: ["enhancement"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - compliance_core
        - compliance_logger
        - compliance_gdpr
        - compliance_integrity
        - compliance_kit
        - reference server (server/)
        - documentation
        - new package
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to achieve, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behaviour you would like. Code sketches welcome.
    validations:
      required: true
  - type: textarea
    id: requirement
    attributes:
      label: Related requirement (optional)
      description: The regulation or standard clause this helps with, if any (for example GDPR Art. 17, OWASP MASVS-STORAGE-2, EN 18031-1 ACM-1).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
