name: compliance_kit
description: Privacy and security toolkit for Flutter - PII-redacting logger, GDPR consent, export and deletion, and Play Integrity / App Attest checks with one shared audit trail.
version: 0.1.0-beta.1
repository: https://github.com/Ahmadhussain0335/compliance_kit/tree/main/packages/compliance_kit
issue_tracker: https://github.com/Ahmadhussain0335/compliance_kit/issues
topics:
  - privacy
  - security
  - gdpr
  - compliance
  - logging

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  compliance_core: ^0.1.0-beta.1
  compliance_gdpr: ^0.1.0-beta.1
  compliance_integrity: ^0.1.0-beta.1
  compliance_logger: ^0.1.0-beta.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
