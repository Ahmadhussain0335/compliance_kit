name: compliance_integrity
description: App and device integrity checks for Flutter - Google Play Integrity on Android and Apple App Attest on iOS, without Firebase.
version: 0.1.0-beta.1
repository: https://github.com/Ahmadhussain0335/compliance_kit/tree/main/packages/compliance_integrity
issue_tracker: https://github.com/Ahmadhussain0335/compliance_kit/issues
topics:
  - security
  - integrity
  - attestation
  - compliance
  - privacy

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  compliance_core: ^0.1.0-beta.1
  flutter:
    sdk: flutter
  # Imported by the Pigeon-generated code; pinned by the Flutter SDK.
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^29.0.11

flutter:
  plugin:
    platforms:
      android:
        package: io.github.ahmadhussain0335.compliance_integrity
        pluginClass: ComplianceIntegrityPlugin
      ios:
        pluginClass: ComplianceIntegrityPlugin

